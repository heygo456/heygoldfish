# Ganti USERNAME/REPO dengan repository GitHub Anda
backend:
  name: github
  repo: heygo456/heygoldfish
  branch: main

locale: id
media_folder: assets/images
public_folder: assets/images

collections:
  - name: artikel
    label: Artikel
    label_singular: Artikel
    folder: content/artikel
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    fields:
      - { label: Judul, name: title, widget: string }
      - label: Kategori
        name: category
        widget: select
        options:
          - { label: Pengenalan, value: kenal }
          - { label: Persiapan, value: setup }
          - { label: Ikan Baru, value: baru }
          - { label: Penyakit, value: sakit }
          - { label: Perawatan, value: rutin }
      - label: Ikon (dipakai bila tanpa gambar sampul)
        name: icon
        widget: select
        default: fish
        options: [fish, tank, box, dots, drop, cal, wave]
      - { label: Gambar sampul, name: cover, widget: image, required: false }
      - { label: Estimasi waktu baca (menit), name: minutes, widget: number, value_type: int, min: 1, default: 5 }
      - { label: Ringkasan (1 kalimat), name: summary, widget: string }
      - { label: Kata kunci pencarian (pisahkan spasi), name: keywords, widget: string, required: false }
      - { label: Tampil di "Sering Dibaca", name: popular, widget: boolean, default: false, required: false }
      - { label: Urutan (kecil = lebih awal), name: order, widget: number, value_type: int, default: 50 }
      - { label: Isi artikel, name: body, widget: markdown, hint: "Gunakan Heading 2 (##) untuk tiap bagian; daftar isi dibuat otomatis." }

  - name: pengaturan
    label: Kamus
    files:
      - label: Kamus Goldfish
        name: kamus
        file: content/kamus.json
        format: json
        fields:
          - label: Istilah
            name: items
            widget: list
            summary: "{{fields.term}}"
            fields:
              - { label: Istilah, name: term, widget: string }
              - label: Kelompok
                name: cat
                widget: select
                options:
                  - { label: Ikan, value: ikan }
                  - { label: Perawatan, value: rawat }
                  - { label: Air & Alat, value: air }
                  - { label: Penyakit, value: sakit }
              - { label: Penjelasan, name: def, widget: text }
              - label: Artikel terkait (opsional)
                name: article
                widget: relation
                collection: artikel
                search_fields: [title]
                value_field: "{{slug}}"
                display_fields: [title]
                required: false

  - name: toko
    label: Toko
    files:
      - label: Katalog Produk
        name: katalog
        file: content/toko.json
        format: json
        fields:
          - label: Produk
            name: items
            widget: list
            label_singular: Produk
            summary: "{{fields.title}}"
            fields:
              - label: Jenis
                name: type
                widget: select
                default: ikan
                options:
                  - { label: "Ikan (dibeli lewat WhatsApp)", value: ikan }
                  - { label: "Perlengkapan / obat / pakan (Shopee atau Tokopedia)", value: produk }
              - { label: Gambar, name: image, widget: image, required: false }
              - { label: Judul, name: title, widget: string }
              - { label: Harga (angka saja; contoh 25000), name: price, widget: number, value_type: int, min: 0, required: false }
              - { label: "Ukuran (khusus ikan, mis. 10 cm)", name: size, widget: string, required: false }
              - label: "Status (khusus ikan)"
                name: status
                widget: select
                default: tersedia
                required: false
                options:
                  - { label: Tersedia, value: tersedia }
                  - { label: Pre-order, value: preorder }
                  - { label: Terjual, value: terjual }
              - { label: "Link Shopee (khusus produk)", name: shopee, widget: string, required: false, pattern: ['^https?://', "Harus diawali https://"] }
              - { label: "Link Tokopedia (khusus produk)", name: tokopedia, widget: string, required: false, pattern: ['^https?://', "Harus diawali https://"] }
              - { label: "Link lain (opsional, dipakai bila Shopee/Tokopedia kosong)", name: url, widget: string, required: false, pattern: ['^https?://', "Harus diawali https://"] }
              - label: "Tampilkan di artikel (opsional)"
                name: articles
                widget: relation
                collection: artikel
                search_fields: [title]
                value_field: "{{slug}}"
                display_fields: [title]
                multiple: true
                required: false

  - name: situs
    label: Pengaturan Situs
    files:
      - label: Kontak, Komunitas & FAQ
        name: kontak
        file: content/pengaturan.json
        format: json
        fields:
          - { label: "Nomor WhatsApp (format 62..., tanpa + atau spasi)", name: whatsapp, widget: string }
          - { label: Link TikTok, name: tiktok, widget: string, required: false }
          - { label: "Link grup/channel komunitas WhatsApp", name: komunitas, widget: string, required: false }
          - { label: "Link formulir pendaftaran penghobi (Google Form/Tally)", name: formulir, widget: string, required: false }
          - { label: Alamat, name: alamat, widget: text, required: false }
          - { label: "Jam buka", name: jam, widget: string, required: false }
          - { label: "Link Google Maps", name: maps, widget: string, required: false }
          - label: "FAQ pembelian"
            name: faq
            widget: list
            required: false
            summary: "{{fields.q}}"
            fields:
              - { label: Pertanyaan, name: q, widget: string }
              - { label: Jawaban, name: a, widget: text }

  - name: info
    label: Halaman Info
    files:
      - label: Teks & Galeri Info
        name: info
        file: content/info.json
        format: json
        fields:
          - label: Galeri foto (geser otomatis di bagian atas Info)
            name: galeri
            widget: list
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { label: Foto, name: image, widget: image }
              - { label: Keterangan (opsional), name: caption, widget: string, required: false }
          - { label: Judul halaman, name: judul, widget: string }
          - { label: Subjudul, name: subjudul, widget: string, required: false }
          - { label: Isi, name: isi, widget: markdown, required: false, hint: "Pisahkan paragraf dengan baris kosong. Teks tebal dengan tombol B." }
          - { label: "Kalimat penutup (kotak hijau)", name: penutup, widget: string, required: false }
          - { label: "Judul bagian kontak", name: kontak_judul, widget: string, required: false }
          - { label: "Teks pengantar kontak", name: kontak_teks, widget: text, required: false }
          - { label: "Judul bagian FAQ", name: faq_judul, widget: string, required: false }
